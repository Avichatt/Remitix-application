services:
  postgres:
    image: postgres:16
    container_name: remitx-postgres
    environment:
      POSTGRES_USER: remitx
      POSTGRES_PASSWORD: remitx_password
      POSTGRES_DB: remitx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
